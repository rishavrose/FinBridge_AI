##############################################################################
# Kubernetes — Ingress (nginx)
##############################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finbridge-mcp-ingress
  namespace: finbridge
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # SSE requires buffering disabled
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-cache: "off"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - mcp.finbridge.io
      secretName: finbridge-mcp-tls
  rules:
    - host: mcp.finbridge.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finbridge-mcp-svc
                port:
                  number: 80
---
##############################################################################
# Kubernetes — HorizontalPodAutoscaler
##############################################################################
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finbridge-mcp-hpa
  namespace: finbridge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finbridge-mcp
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
