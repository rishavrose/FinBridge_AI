##############################################################################
# Kubernetes — Service
##############################################################################
apiVersion: v1
kind: Service
metadata:
  name: finbridge-mcp-svc
  namespace: finbridge
  labels:
    app: finbridge-mcp
spec:
  type: ClusterIP
  selector:
    app: finbridge-mcp
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
---
##############################################################################
# Kubernetes — ServiceAccount
##############################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finbridge-mcp-sa
  namespace: finbridge
  labels:
    app: finbridge-mcp
automountServiceAccountToken: false
